services:
  api:
    image: gamecourt/gcs-api:${GCS_VERSION:?GCS_VERSION is required}
    restart: unless-stopped
    env_file:
      - ./.env.prod
    expose:
      - "8000"
    volumes:
      - api_data:/data
    healthcheck:
      # api image has Python; stdlib HTTP probe. No host-shell quoting involved.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

  web:
    image: gamecourt/gcs-web:${GCS_VERSION:?GCS_VERSION is required}
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      # Deterministic: curl exists in the web image (verified).
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      # Deterministic: curl exists in caddy image (verified). Probe local admin API.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

volumes:
  api_data:
  caddy_data:
  caddy_config:
