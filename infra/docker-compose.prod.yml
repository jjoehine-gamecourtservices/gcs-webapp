services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: gcs-api-local
    restart: unless-stopped
    env_file:
      - ./.env.prod
    expose:
      - "8000"
    volumes:
      - api_data:/data
      - /srv/gcs/shares:/mnt/shares
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: gcs-web-local
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

volumes:
  api_data:
  caddy_data:
  caddy_config:
